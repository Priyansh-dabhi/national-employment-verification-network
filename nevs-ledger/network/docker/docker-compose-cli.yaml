version: '3.7'

networks:
  nevs_net:
    name: nevs_network
    external: true

services:
  cli:
    container_name: cli
    image: hyperledger/fabric-tools:2.5
    tty: true
    stdin_open: true
    environment:
      - GOPATH=/opt/gopath
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=cli
      - CORE_PEER_ADDRESS=peer0.central.govt:7051
      - CORE_PEER_LOCALMSPID=CentralGovtMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/peerOrganizations/central.govt/peers/peer0.central.govt/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/peerOrganizations/central.govt/peers/peer0.central.govt/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/peerOrganizations/central.govt/peers/peer0.central.govt/tls/ca.crt
      - CORE_PEER_MSPCONFIGPATH=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/peerOrganizations/central.govt/users/Admin@central.govt/msp
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: /bin/bash
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations:/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations
      - ../../chaincode:/opt/gopath/src/github.com/hyperledger/fabric/peer/chaincode
      - ../../nevs.tar.gz:/tmp/nevs.tar.gz
      - ../../employment.tar.gz:/tmp/employment.tar.gz
      - ../channel-artifacts:/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/../../channel-artifacts
      - ../configtx:/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/../../configtx
      - ../../scripts/bash/restore_full_network.sh:/tmp/restore_full_network.sh
    networks:
      - nevs_net
