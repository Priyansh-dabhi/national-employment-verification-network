version: '3.7'

networks:
  nevs_net:
    name: nevs_network

services:
  employment.cc:
    build:
      context: ../../chaincode/employment
      dockerfile: Dockerfile
    container_name: employment.cc
    environment:
      - CHAINCODE_SERVER_ADDRESS=0.0.0.0:9999
      - CHAINCODE_ID=${CHAINCODE_ID:-pending_install}
      - CORE_PEER_TLS_ENABLED=false
    ports:
      - "9999:9999"
    networks:
      - nevs_net
