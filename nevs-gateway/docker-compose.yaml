version: '3.7'

networks:
  nevs_net:
    external:
      name: nevs_network

services:
  nevs-gateway:
    build: .
    container_name: nevs-gateway
    ports:
      - "3000:3000"
    environment:
      # Use dynamic hostnames now that we are inside the Docker network
      - PORT=3000
      - MSPID=CentralGovtMSP
      - CHANNEL_NAME=nevs-channel
      - CHAINCODE_NAME=employment
      - CONNECTION_PROFILE_PATH=/app/config/connection-profile.json
      - WALLET_PATH=/app/wallet
    volumes:
      - ./config:/app/config
      - ./wallet:/app/wallet
      - ./src:/app/src
      # Mount the network crypto materials so the container can access the TLS certificates required by the connection profile
      - ../nevs-ledger/network/organizations:/organizations
      # Mount the docker socket so God Mode APIs can kill peers
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - nevs_net
