version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: nevn-postgres
    environment:
      POSTGRES_DB: nevn_db
      POSTGRES_USER: nevn_user
      POSTGRES_PASSWORD: nevn_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
